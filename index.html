<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>فودیار 🍔</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <div class="topbar">

    <button id="randomBtn" class="random-btn">
      🍔 امروز چی میل کنیم؟
    </button>

  </div>

  <main class="container">

    <section class="hero">

      <h1>
        فودیار 🍔
      </h1>

    </section>

    <!-- FILTER BAR - دو ردیف جداگانه با اسکرول افقی -->
    <section class="filter-bar">

      <!-- ردیف اول: دسته بندی غذاها -->
      <div class="filter-row">
        <div class="filter-label">دسته بندی</div>
        <div class="filter-scroll-wrapper">
          <div class="chips categories">
            <button class="chip active category-btn" data-category="همه">همه</button>
            <button class="chip category-btn" data-category="ایرانی">ایرانی</button>
            <button class="chip category-btn" data-category="خارجی">خارجی</button>
            <button class="chip category-btn" data-category="فست‌فود">فست‌فود</button>
            <button class="chip category-btn" data-category="رژیمی">رژیمی</button>
            <button class="chip category-btn" data-category="صبحانه">صبحانه</button>
            <button class="chip category-btn" data-category="دسر">دسر</button>
          </div>
        </div>
      </div>

      <!-- ردیف دوم: علاقه مندی ها -->
      <div class="filter-row">
        <div class="filter-label">علاقه مندی</div>
        <div class="filter-scroll-wrapper">
          <div class="chips favorite-filter-buttons">
            <button class="chip favorite-filter-btn active" data-name="همه">همه</button>
          </div>
        </div>
      </div>

    </section>

    <!-- ADD FOOD -->

    <section class="add-food-section">

      <h2>
        ➕ اضافه کردن غذا
      </h2>

      <form id="foodForm">

        <input
          type="text"
          id="foodName"
          placeholder="اسم غذا..."
          required
        />

        <input
          type="url"
          id="foodImage"
          placeholder="لینک عکس غذا (اختیاری)"
        />

        <select id="foodCategory" required>

          <option value="">
            انتخاب دسته بندی
          </option>

          <option value="ایرانی">
            ایرانی
          </option>

          <option value="خارجی">
            خارجی
          </option>

          <option value="فست‌فود">
            فست‌فود
          </option>

          <option value="رژیمی">
            رژیمی
          </option>

          <option value="صبحانه">
            صبحانه
          </option>

          <option value="دسر">
            دسر
          </option>

        </select>

        <button type="submit">
          ✨ ذخیره غذا
        </button>

      </form>

      <div id="successMessage" class="success-message">
        ✅ غذا اضافه شد
      </div>

    </section>

    <section class="foods-section">

      <div
        id="foodsContainer"
        class="foods-grid"
      ></div>

    </section>

  </main>

  <!-- RANDOM -->

  <div id="randomModal" class="modal">

    <div class="modal-content">

      <span class="close-modal">
        &times;
      </span>

      <div id="loadingSpinner" class="spinner-container">

        <div class="spinner"></div>

        <p>
          داریم انتخاب می‌کنیم 🍟
        </p>

      </div>

      <div id="randomFoodResult" class="random-result hidden">

        <img id="randomFoodImage" src="" />

        <h2 id="randomFoodName"></h2>

        <p id="randomFoodCategory"></p>

      </div>

    </div>

  </div>

  <!-- FAVORITE -->

  <div id="favoriteModal" class="favorite-modal">

    <div class="favorite-content">

      <span class="close-favorite">
        &times;
      </span>

      <h3>
        ⭐ چه کسی این غذا را دوست دارد؟
      </h3>

      <p style="color:#888; font-size:0.75rem; margin:8px 0;">برای ثبت علاقه‌مندی کلیک کنید (کلیک مجدد برای حذف)</p>

      <div class="members-list">
        <!-- دکمه‌ها با جاوااسکریپت پر می‌شوند -->
      </div>

    </div>

  </div>

  <!-- EDIT -->

  <div id="editModal" class="favorite-modal">

    <div class="favorite-content">

      <span id="closeEdit" class="close-favorite">
        &times;
      </span>

      <h3>
        ✏️ ویرایش غذا
      </h3>

      <div class="edit-form">

        <input
          type="text"
          id="editName"
          placeholder="اسم غذا"
        />

        <input
          type="url"
          id="editImage"
          placeholder="لینک عکس (اختیاری)"
        />

        <select id="editCategory">

          <option value="ایرانی">
            ایرانی
          </option>

          <option value="خارجی">
            خارجی
          </option>

          <option value="فست‌فود">
            فست‌فود
          </option>

          <option value="رژیمی">
            رژیمی
          </option>

          <option value="صبحانه">
            صبحانه
          </option>

          <option value="دسر">
            دسر
          </option>

        </select>

        <button id="saveEditBtn">
          ذخیره تغییرات
        </button>

      </div>

    </div>

  </div>

  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
